# Runs on pull requests so a contributor sees problems with their profile before
# a maintainer has to review it.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check data files
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck
