# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Nothing else to configure.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run build` validates data/*.json first, so a malformed profile
      # fails the deploy instead of publishing a broken directory.
      - run: npm run build
        env:
          # Derived from the repo name, so forks deploy correctly with no edits.
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
